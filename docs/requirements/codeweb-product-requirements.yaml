      The Codeweb npm package shall install without resolving a required
      runtime dependency.
    source:
      - SRC-SPEC
      - SRC-CHARTER
    source_document: SPEC.md
    source_paragraph: Acceptance criteria, AC-3
    source_excerpt: >-
      the product installs and runs with zero required dependencies
    rationale: Preserve the installation part of the source requirement.
    assumptions:
      - The package installation uses a supported Node.js runtime.
    parents: []
    derived: false
    allocated_to:
      - Codeweb npm package
    verification:
      method: test
      success_criteria: >-
        An installation from the packed artifact returns exit code 0 without a
        required runtime dependency fetch.
      verification_level: product
      verification_lead: codeweb-maintainer
      facility: isolated temporary npm prefix
      phase: package acceptance
      acceptance_requirement: true
      preflight_acceptance: false
      performing_organization: Codeweb project
      results_state: PASS
      evidence:
        - test:tests/package-shape.test.mjs::P3
        - command:node --test tests/package-shape.test.mjs
      discrepancies: []
      configuration: reviewed commit

  - id: CW-PR-004
    type: quality
    level: product
    owner: codeweb-operator
    text: >-
      The Codeweb prove-red check shall return exit code 0 only after its
      failing canary causes the gate to fail.
    source:
      - SRC-SPEC
    source_document: SPEC.md
    source_paragraph: Acceptance criteria, AC-4
    source_excerpt: >-
      the gate can go red: prove-red plants a failing canary and the gate
      catches it
    rationale: Prove that the regression gate detects a known failure.
    assumptions: []
    parents: []
    derived: false
    allocated_to:
      - scripts/check
    verification:
      method: test
      success_criteria: >-
        `sh scripts/check --prove-red` observes the expected canary failure,
        prints `PROVE-RED OK`, and returns exit code 0.
      verification_level: product
      verification_lead: codeweb-maintainer
      facility: supported local runtime
      phase: regression
      acceptance_requirement: true
      preflight_acceptance: false
      performing_organization: Codeweb project
      results_state: PASS
