unresolved:
  - id: DEC-AC3-001
    statement: >-
      AC-3 claims that the product installs and runs with zero required
      dependencies, but its current check only inspects the package.json
      dependencies field.
    decision_needed: >-
      Approve an isolated packed-package installation test and its success
      criteria, or narrow the controlling AC-3 source claim.
    owner: codeweb-operator
    due_date: "2026-07-29"
    status: CLOSED
    resolution: >-
      tests/package-shape.test.mjs P3 packs the real artifact, installs it in an
      isolated prefix with offline mode and optional dependencies omitted, and
      verifies that each installed binary returns exit code 0 for `--help`.
