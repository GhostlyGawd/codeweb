# FUNNEL §5 / RETENTION §4.5: the acquisition ledger — a weekly snapshot of the PUBLIC counters
# the maintainer can ethically read (npm weekly downloads, stars/forks). GitHub traffic data
# expires in 14 days and npm shows only a point-in-time number; this series is the only way
# acquisition/retention SHAPE ever becomes visible. No beacon, no user data — public APIs only.
name: acquisition ledger
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append this week's public counters
        run: |
          set -euo pipefail
          NPM=$(curl -sf 'https://api.npmjs.org/downloads/point/last-week/@ghostlygawd/codeweb' || echo '{}')
          REPO=$(curl -sf -H "Authorization: Bearer ${{ github.token }}" 'https://api.github.com/repos/${{ github.repository }}' || echo '{}')
          # CHARTER non-goal 5, trigger arm 2 (">10 external repos on the gate Action") was
          # UNMEASURED — the parked Teams tier's own trigger could never be observed firing
          # (PLAN finding 6; REVENUE §2 defined it as countable via public code search).
          # Public API only, same ethics as every other counter. Fail-soft: null on API error.
          GATE=$(curl -sf -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            'https://api.github.com/search/code?q=%22codeweb-gate%22+path%3A.github%2Fworkflows+-repo%3AGhostlyGawd%2Fcodeweb&per_page=100' || echo '{}')
          node -e '
            const npm = JSON.parse(process.argv[1] || "{}"), repo = JSON.parse(process.argv[2] || "{}"), gate = JSON.parse(process.argv[3] || "{}");
            const row = {
              at: new Date().toISOString().slice(0, 10),
              npmWeeklyDownloads: npm.downloads ?? null,
              npmPeriodStart: npm.start ?? null,
              npmPeriodEnd: npm.end ?? null,
              stars: repo.stargazers_count ?? null,
              forks: repo.forks_count ?? null,
              openIssues: repo.open_issues_count ?? null,
              // unique external repos referencing the gate in a workflow file (first page of 100
              // matches — exact until adoption far exceeds the >10 trigger it exists to watch)
              gateReposExternal: gate.total_count != null
                ? new Set((gate.items || []).map((i) => i.repository && i.repository.full_name).filter(Boolean)).size
                : null,
            };
            require("fs").appendFileSync("bench/acquisition-ledger.jsonl", JSON.stringify(row) + "\n");
            console.log("appended:", JSON.stringify(row));
          ' "$NPM" "$REPO" "$GATE"
      - name: Render the public npm trend
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '3 days ago' +%F)
          NPM_RANGE="${RUNNER_TEMP}/npm-downloads-range.json"
          curl -fsSL "https://api.npmjs.org/downloads/range/2026-07-19:${CUTOFF}/%40ghostlygawd%2Fcodeweb" -o "$NPM_RANGE"
          node scripts/render-acquisition.mjs "$NPM_RANGE"
      - name: Commit the row
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add bench/acquisition-ledger.jsonl assets/metrics/npm-downloads.svg
          git diff --cached --quiet || git commit -m 'ledger: weekly acquisition snapshot [skip ci]'
          git push
