<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <pattern id="dith" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0D0D11"/>
      <rect x="0" y="0" width="1" height="1" fill="#57545F"/>
      <rect x="2" y="2" width="1" height="1" fill="#57545F"/>
    </pattern>
    <style>
      .box{fill:#0D0D11;stroke:#26242C;stroke-width:1.5}
      .glow{fill:none;stroke:#C6F24E;stroke-width:2;opacity:0}
      .lbl{fill:#8A8794;font-size:15px;font-weight:700;letter-spacing:3px;text-anchor:middle}
      .num{fill:#060608;font-size:13px;font-weight:700;text-anchor:middle}
      @keyframes glow{0%{opacity:0}5%{opacity:1}19%{opacity:1}26%{opacity:0}100%{opacity:0}}
      @keyframes lift{0%{opacity:.55}5%{opacity:1}26%{opacity:.55}100%{opacity:.55}}
      .g1{animation:glow 6s linear infinite}.g2{animation:glow 6s linear infinite 1.5s}
      .g3{animation:glow 6s linear infinite 3s}.g4{animation:glow 6s linear infinite 4.5s}
      .l1{animation:lift 6s linear infinite}.l2{animation:lift 6s linear infinite 1.5s}
      .l3{animation:lift 6s linear infinite 3s}.l4{animation:lift 6s linear infinite 4.5s}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1039" height="299" fill="#060608" stroke="#26242C"/>

  <!-- connectors -->
  <g stroke="#8A8794" stroke-width="1.5" stroke-dasharray="2 3">
    <line x1="250" y1="150" x2="300" y2="150"/>
    <line x1="510" y1="150" x2="560" y2="150"/>
    <line x1="770" y1="150" x2="820" y2="150"/>
  </g>

  <!-- stage 1: extract — source becomes atomic nodes -->
  <g class="l1">
    <rect class="box" x="40" y="78" width="210" height="144"/>
    <g fill="#B1AEBD">
      <rect x="99" y="134" width="12" height="12"/><rect x="139" y="122" width="12" height="12"/>
      <rect x="179" y="140" width="12" height="12"/><rect x="119" y="160" width="12" height="12"/>
      <rect x="162" y="166" width="12" height="12"/>
    </g>
  </g>
  <rect class="glow g1" x="36" y="74" width="218" height="152"/>
  <rect x="49" y="87" width="22" height="22" fill="#C6F24E"/><text class="num" x="60" y="103">1</text>
  <text class="lbl" x="145" y="252">EXTRACT</text>

  <!-- stage 2: cluster — nodes grouped into dithered domains -->
  <g class="l2">
    <rect class="box" x="300" y="78" width="210" height="144"/>
    <rect x="332" y="122" width="76" height="62" fill="url(#dith)" stroke="#ECEAF1"/>
    <rect x="424" y="112" width="58" height="48" fill="url(#dith)" stroke="#96939F"/>
    <rect x="424" y="172" width="42" height="34" fill="url(#dith)" stroke="#646170"/>
  </g>
  <rect class="glow g2" x="296" y="74" width="218" height="152"/>
  <rect x="309" y="87" width="22" height="22" fill="#C6F24E"/><text class="num" x="320" y="103">2</text>
  <text class="lbl" x="405" y="252">CLUSTER</text>

  <!-- stage 3: overlap — a duplicate pair flagged -->
  <g class="l3">
    <rect class="box" x="560" y="78" width="210" height="144"/>
    <rect x="620" y="128" width="40" height="40" fill="#B1AEBD"/>
    <rect x="646" y="140" width="40" height="40" fill="none" stroke="#C6F24E" stroke-width="2" stroke-dasharray="3 2.5"/>
    <text x="665" y="118" fill="#E8E7EE" font-size="15" text-anchor="middle">=</text>
  </g>
  <rect class="glow g3" x="556" y="74" width="218" height="152"/>
  <rect x="569" y="87" width="22" height="22" fill="#C6F24E"/><text class="num" x="580" y="103">3</text>
  <text class="lbl" x="665" y="252">OVERLAP</text>

  <!-- stage 4: render — the interactive report -->
  <g class="l4">
    <rect class="box" x="820" y="78" width="180" height="144"/>
    <rect x="838" y="96" width="144" height="20" fill="#060608" stroke="#26242C"/>
    <rect x="846" y="102" width="8" height="8" fill="#C6F24E"/>
    <rect x="838" y="126" width="62" height="78" fill="#060608" stroke="#26242C"/>
    <rect x="846" y="136" width="46" height="6" fill="#C6F24E"/>
    <rect x="846" y="150" width="40" height="6" fill="#B1AEBD"/>
    <rect x="846" y="164" width="44" height="6" fill="#7C7987"/>
    <rect x="846" y="178" width="34" height="6" fill="#4E4C59"/>
    <rect x="910" y="126" width="72" height="78" fill="#060608" stroke="#26242C"/>
    <g stroke="#8A8794" stroke-width="1" stroke-dasharray="1 3">
      <line x1="930" y1="150" x2="958" y2="162"/><line x1="930" y1="150" x2="940" y2="180"/>
      <line x1="958" y1="162" x2="940" y2="180"/>
    </g>
    <rect x="925" y="145" width="10" height="10" fill="#ECEAF1"/>
    <rect x="953" y="157" width="9" height="9" fill="#96939F"/>
    <rect x="935" y="175" width="9" height="9" fill="#C6F24E"/>
  </g>
  <rect class="glow g4" x="816" y="74" width="188" height="152"/>
  <rect x="829" y="87" width="22" height="22" fill="#C6F24E"/><text class="num" x="840" y="103">4</text>
  <text class="lbl" x="910" y="252">RENDER</text>

  <!-- traveling pulse along the pipeline -->
  <rect width="10" height="10" y="145" fill="#C6F24E">
    <animate attributeName="x" values="40;995" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.5;0.96;1" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
