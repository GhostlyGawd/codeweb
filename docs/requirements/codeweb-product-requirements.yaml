    source_document: SPEC.md
    source_paragraph: Acceptance criteria, AC-2
    source_excerpt: >-
      every public claim surface agrees with package.json and the charter
      identity line
    rationale: Prevent drift between public claims and canonical product facts.
    assumptions: []
    parents: []
    derived: false
    allocated_to:
      - scripts/check-consistency.mjs
    verification:
      method: test
      success_criteria: >-
        `node scripts/check-consistency.mjs` returns exit code 0 for the
        reviewed commit, and its regression tests reject each supported drift
        class.
      verification_level: product
      verification_lead: codeweb-maintainer
      facility: supported local runtime
      phase: regression
      acceptance_requirement: true
      preflight_acceptance: false
      performing_organization: Codeweb project
      results_state: PASS
      evidence:
        - command:node scripts/check-consistency.mjs
        - test:tests/test_ac_pins.py::TestAcPins::test_ac_2_consistency_gate_green
      discrepancies: []
      configuration: reviewed commit

