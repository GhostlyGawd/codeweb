# The same gate as scripts/check locally. Operator: make this workflow a
# required status check (branch protection) so red can never merge.
# Instantiated for codeweb (ADR-0001, deviation a): the gate runs the repo's
# Node checks too, so Node joins Python in the setup.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh scripts/check
