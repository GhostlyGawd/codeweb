<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 220" width="1040" height="220" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">
  <rect x="0.5" y="0.5" width="1039" height="219" fill="#060608" stroke="#26242C"/>

  <g stroke="#8A8794" stroke-width="1.5" stroke-dasharray="2 3">
    <line x1="262" y1="110" x2="286" y2="110"/><line x1="517" y1="110" x2="541" y2="110"/>
    <line x1="772" y1="110" x2="796" y2="110"/>
  </g>

  <!-- stage template: panel + numbered chip + name + description -->
  <g>
    <rect x="30" y="34" width="232" height="152" fill="#0D0D11" stroke="#26242C"/>
    <rect x="46" y="49" width="22" height="22" fill="#C6F24E"/><text x="57" y="65" font-size="13" font-weight="700" fill="#060608" text-anchor="middle">1</text>
    <text x="80" y="65" font-size="16" font-weight="700" letter-spacing="2" fill="#E8E7EE">EXTRACT</text>
    <text font-size="13" fill="#8A8794"><tspan x="48" y="102">parse every file into atomic</tspan><tspan x="48" y="124">nodes &#8212; functions, classes,</tspan><tspan x="48" y="146">methods &#8212; plus call &amp; import</tspan><tspan x="48" y="168">edges.</tspan></text>
  </g>
  <g>
    <rect x="285" y="34" width="232" height="152" fill="#0D0D11" stroke="#26242C"/>
    <rect x="301" y="49" width="22" height="22" fill="#C6F24E"/><text x="312" y="65" font-size="13" font-weight="700" fill="#060608" text-anchor="middle">2</text>
    <text x="335" y="65" font-size="16" font-weight="700" letter-spacing="2" fill="#E8E7EE">CLUSTER</text>
    <text font-size="13" fill="#8A8794"><tspan x="303" y="102">strip genuine utility hubs,</tspan><tspan x="303" y="124">then group nodes into</tspan><tspan x="303" y="146">directory-anchored semantic</tspan><tspan x="303" y="168">domains.</tspan></text>
  </g>
  <g>
    <rect x="540" y="34" width="232" height="152" fill="#0D0D11" stroke="#26242C"/>
    <rect x="556" y="49" width="22" height="22" fill="#C6F24E"/><text x="567" y="65" font-size="13" font-weight="700" fill="#060608" text-anchor="middle">3</text>
    <text x="590" y="65" font-size="16" font-weight="700" letter-spacing="2" fill="#E8E7EE">OVERLAP</text>
    <text font-size="13" fill="#8A8794"><tspan x="558" y="102">detect duplicated logic,</tspan><tspan x="558" y="124">confirmed against the real</tspan><tspan x="558" y="146">function bodies &#8212; not name</tspan><tspan x="558" y="168">coincidences.</tspan></text>
  </g>
  <g>
    <rect x="795" y="34" width="215" height="152" fill="#0D0D11" stroke="#26242C"/>
    <rect x="811" y="49" width="22" height="22" fill="#C6F24E"/><text x="822" y="65" font-size="13" font-weight="700" fill="#060608" text-anchor="middle">4</text>
    <text x="845" y="65" font-size="16" font-weight="700" letter-spacing="2" fill="#E8E7EE">RENDER</text>
    <text font-size="13" fill="#8A8794"><tspan x="813" y="102">emit a self-contained,</tspan><tspan x="813" y="124">interactive HTML map</tspan><tspan x="813" y="146">(plus machine-readable</tspan><tspan x="813" y="168">graph.json).</tspan></text>
  </g>
</svg>
