title: Codeweb product requirements
language_profile: shall
lifecycle_profile: general
objective: >-
  Define traceable and objectively verifiable requirement records for the built
  acceptance criteria in SPEC.md without changing the controlling product
  intent.
system_boundary: >-
  The Codeweb product suite, consistency gate, package manifest, prove-red
  check, npm package contents, shipped command-line binaries, evaluation
  runner, JSON import mapping, and pre-edit importer card are in scope. Roadmap
  candidates, hosted services, and new product behavior are out of scope.
intended_readers:
  - Codeweb maintainers
  - Codeweb contributors
  - requirements reviewers
  - verification reviewers
lifecycle_scope:
  product_layer: product
  lifecycle_phase: operations-and-sustainment
  included_processes:
    - technical_requirements_definition
    - requirements_management
    - verification_planning
  excluded_processes:
    - new_product_definition
    - roadmap_selection
source_authorities:
  - id: SRC-CHARTER
    title: CHARTER.md
    precedence: 1
  - id: SRC-SPEC
    title: SPEC.md
    precedence: 2
  - id: SRC-SHIPPED
    title: Shipped implementation and tests at the reviewed commit
    precedence: 3
controlled_terms:
  - term: Codeweb product suite
    definition: The test suite invoked by the package.json npm test script.
    source: SRC-SPEC
    approved: true
  - term: public claim surface
    definition: A claim-bearing file that scripts/check-consistency.mjs enumerates.
    source: SRC-SHIPPED
    approved: true
  - term: repository-only path
    definition: A path that tests/package-shape.test.mjs classifies as excluded repository content.
    source: SRC-SHIPPED
    approved: true
  - term: harness file
    definition: A path that tests/package-shape.test.mjs classifies as excluded harness content.
    source: SRC-SHIPPED
    approved: true
protected_values: []
approval_authority:
  - approver_id: codeweb-operator
    role: baseline_approver
    authority_source: CHARTER.md introduction and Open questions
requirements:
  - id: CW-PR-001
    type: quality
    level: product
    owner: codeweb-operator
    text: >-
      The Codeweb product suite shall pass when an operator runs `npm test`
      from a checkout that has no installed project dependencies.
    source:
      - SRC-SPEC
    source_document: SPEC.md
    source_paragraph: Acceptance criteria, AC-1
    source_excerpt: >-
      the full product suite passes from a bare, dependency-free checkout
    rationale: >-
      Preserve the source requirement that the complete product suite works
      without installed project dependencies.
    assumptions:
      - The checkout has the declared Node.js and Python runtime versions.
    parents: []
    derived: false
    allocated_to:
      - Codeweb product suite
    verification:
      method: test
      success_criteria: >-
        `npm test` returns exit code 0 from a clean worktree that has no
        node_modules directory.
      verification_level: product
      verification_lead: codeweb-maintainer
      facility: supported local runtime
      phase: regression
      acceptance_requirement: true
      preflight_acceptance: false
      performing_organization: Codeweb project
      results_state: PASS
      evidence:
        - command:npm test
      discrepancies: []
      configuration: reviewed commit

  - id: CW-PR-002
    type: quality
    level: product
    owner: codeweb-operator
    text: >-
      The Codeweb consistency gate shall return exit code 0 only when all
      enumerated public claim surfaces match their canonical values.
    source:
